<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIB HOUSE | Management & Kitchen Portal</title>
    <!-- Prevent Search Engine Indexing for Hidden Page -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts Matching Main Website -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        :root {
            --color-orange: #E67E22;
            --color-orange-dark: #D35400;
            --color-orange-light: #FFF5EB;
            --color-orange-border: rgba(230, 126, 34, 0.4);
            --light-bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --card-border: rgba(230, 126, 34, 0.35);
            --light-border: #E2E8F0;
            --text-dark: #111114;
            --text-muted: #64748B;
            --color-ready: #10B981;
            --color-hold: #F59E0B;
            --color-unavail: #EF4444;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--light-bg);
            background-image: 
                radial-gradient(circle at center, rgba(255, 255, 255, 0.90) 0%, rgba(248, 246, 240, 0.97) 100%),
                url('logo.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: min(480px, 75vw) auto;
            color: var(--text-dark);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Luxury White & Orange Admin Bar */
        .admin-nav-bar {
            background: #FFFFFF;
            border-bottom: 1px solid var(--color-orange-border);
            box-shadow: 0 2px 14px rgba(230, 126, 34, 0.08);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .admin-nav-logo {
            height: 38px;
            width: auto;
        }

        .admin-nav-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--color-orange-dark);
            text-transform: uppercase;
        }

        .admin-user-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(230, 126, 34, 0.12);
            color: var(--color-orange-dark);
            border: 1px solid var(--color-orange);
        }

        .btn-admin-logout {
            background: #FFFFFF;
            border: 1px solid var(--color-orange);
            color: var(--color-orange-dark);
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-admin-logout:hover {
            background: var(--color-unavail);
            color: #FFFFFF;
            border-color: var(--color-unavail);
        }

        /* Main Container */
        .admin-main-wrapper {
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px 80px 16px;
            flex: 1;
        }

        /* Portal Tabs Navigation */
        .portal-tabs-bar {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid var(--color-orange-border);
            margin-bottom: 24px;
            overflow-x: auto;
        }

        .portal-tab-btn {
            background: #FFFFFF;
            border: 1px solid var(--light-border);
            border-bottom: 3px solid transparent;
            color: var(--text-muted);
            padding: 12px 20px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .portal-tab-btn.active {
            color: var(--color-orange-dark);
            border-bottom-color: var(--color-orange);
            background: var(--color-orange-light);
            border-color: var(--color-orange-border);
        }

        /* Category Filter Tabs Bar (Ordered Exactly as Main Menu) */
        .category-filters-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .btn-cat-filter {
            background: #FFFFFF;
            border: 1px solid var(--card-border);
            color: #475569;
            padding: 8px 14px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .btn-cat-filter.active, .btn-cat-filter:hover {
            background: var(--color-orange);
            color: #FFFFFF;
            border-color: var(--color-orange);
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.25);
        }

        /* Search & Info Bar */
        .search-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-input-box {
            background: #FFFFFF;
            border: 1px solid var(--color-orange);
            color: var(--text-dark);
            padding: 10px 16px;
            font-size: 0.85rem;
            width: 100%;
            max-width: 380px;
            outline: none;
            box-shadow: 0 2px 8px rgba(230, 126, 34, 0.08);
        }

        .search-input-box:focus {
            border-color: var(--color-orange-dark);
            box-shadow: 0 2px 12px rgba(230, 126, 34, 0.2);
        }

        .status-legend-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .legend-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            display: inline-block;
        }

        /* Dishes Inventory Grid */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 16px;
        }

        .inv-dish-card {
            background: #FFFFFF;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .inv-dish-card:hover {
            border-color: var(--color-orange);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.12);
        }

        .inv-dish-card.status-hold {
            border-color: var(--color-hold);
            background: #FFFBEB;
        }

        .inv-dish-card.status-unavailable {
            border-color: var(--color-unavail);
            background: #FEF2F2;
            opacity: 0.75;
        }

        .inv-dish-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }

        .inv-dish-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .inv-dish-category {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--color-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inv-dish-price {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-orange-dark);
            white-space: nowrap;
            margin-left: 8px;
        }

        /* 3-Way Action Status Buttons */
        .inv-state-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-inv-state {
            padding: 8px 6px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: 1px solid #CBD5E1;
            background: #F8FAFC;
            color: #64748B;
            transition: all 0.15s;
            text-align: center;
        }

        .btn-inv-state:hover {
            border-color: var(--color-orange);
        }

        .btn-inv-state.state-ready.active {
            background: var(--color-ready);
            color: #FFFFFF;
            border-color: var(--color-ready);
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
        }

        .btn-inv-state.state-hold.active {
            background: var(--color-hold);
            color: #000000;
            border-color: var(--color-hold);
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }

        .btn-inv-state.state-unavailable.active {
            background: var(--color-unavail);
            color: #FFFFFF;
            border-color: var(--color-unavail);
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
        }

        /* Orders Feed & Ticket Cards */
        .orders-feed-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .order-ticket-card {
            background: #FFFFFF;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .order-ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--light-border);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .order-id-badge {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--color-orange-dark);
        }

        .order-timestamp {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .order-items-list {
            margin-bottom: 14px;
        }

        .order-item-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .order-item-name {
            font-weight: 600;
            color: var(--text-dark);
        }

        .order-item-qty {
            color: var(--color-orange-dark);
            font-weight: 800;
        }

        .order-ticket-footer {
            border-top: 1px solid var(--light-border);
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-total-amount {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--color-orange-dark);
        }

        .order-status-actions {
            display: flex;
            gap: 6px;
        }

        .btn-order-action {
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--light-border);
            background: #F8FAFC;
            color: var(--text-dark);
        }

        .btn-order-action.ready {
            background: var(--color-ready);
            border-color: var(--color-ready);
            color: #FFFFFF;
        }

        /* 2-Role Login Gate Modal Overlay */
        .auth-gate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 17, 20, 0.6);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .auth-gate-box {
            background: #FFFFFF;
            border: 2px solid var(--color-orange);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 440px;
            width: 100%;
            padding: 36px 28px;
            text-align: center;
        }

        .auth-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-orange-dark);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .auth-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .role-selector-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }

        .role-btn {
            background: #F8FAFC;
            border: 1px solid var(--light-border);
            color: var(--text-muted);
            padding: 10px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .role-btn.active {
            background: var(--color-orange);
            color: #FFFFFF;
            border-color: var(--color-orange);
        }

        .auth-input {
            width: 100%;
            background: #F8FAFC;
            border: 1px solid #CBD5E1;
            color: var(--text-dark);
            padding: 12px 16px;
            font-size: 0.95rem;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 14px;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--color-orange);
            background: #FFFFFF;
        }

        .btn-auth-submit {
            width: 100%;
            background: var(--color-orange);
            border: 1px solid var(--color-orange);
            color: #FFFFFF;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-auth-submit:hover {
            background: var(--color-orange-dark);
            border-color: var(--color-orange-dark);
        }

        .auth-error-msg {
            color: var(--color-unavail);
            font-size: 0.78rem;
            font-weight: 700;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="admin-nav-bar">
        <div class="admin-nav-left">
            <img src="logo.png" alt="Rib House Logo" class="admin-nav-logo">
            <div>
                <h1 class="admin-nav-title">RIB HOUSE PORTAL</h1>
            </div>
            <span class="admin-user-badge" id="nav-role-badge">STAFF</span>
        </div>
        <div>
            <button type="button" class="btn-admin-logout" onclick="handleLogout()">Sign Out</button>
        </div>
    </header>

    <!-- MAIN ADMIN WRAPPER -->
    <main class="admin-main-wrapper" id="admin-main-content" style="display: none;">

        <!-- TABS BAR -->
        <nav class="portal-tabs-bar">
            <button type="button" class="portal-tab-btn active" id="tab-btn-inventory" onclick="switchPortalTab('inventory')">
                Dish Inventory & Availability (<span id="total-items-badge">85</span>)
            </button>
            <button type="button" class="portal-tab-btn" id="tab-btn-orders" onclick="switchPortalTab('orders')">
                Live Kitchen Orders (<span id="active-orders-count">0</span>)
            </button>
            <button type="button" class="portal-tab-btn" id="tab-btn-settings" onclick="switchPortalTab('settings')" style="display: none;">
                Security & Settings
            </button>
        </nav>

        <!-- TAB 1: FULL DISH INVENTORY & AVAILABILITY ENGINE -->
        <section id="section-inventory">
            
            <!-- Category Filter Tabs Bar (Ordered Exactly as Menu) -->
            <div class="category-filters-bar">
                <button type="button" class="btn-cat-filter active" onclick="filterCategory('all', this)">All Items (85)</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('sides', this)">Sides & Pairings</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('breakfast', this)">Breakfast Combos</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('barista', this)">Barista & Hot Drinks</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('cold_drinks', this)">Cold Drinks & Shakes</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('main', this)">Main Dishes</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('choma', this)">Choma, Chemsha & Platters</button>
                <button type="button" class="btn-cat-filter" onclick="filterCategory('extra_sides', this)">Extra Sides & Veges</button>
            </div>

            <!-- Search & Legend Toolbar -->
            <div class="search-info-bar">
                <input type="text" id="inv-search-input" class="search-input-box" placeholder="Search dish, side, drink..." oninput="handleSearchInventory(this.value)">
                
                <div class="status-legend-bar">
                    <span class="legend-pill"><span class="legend-dot" style="background: var(--color-ready);"></span> Ready (+ Add to Order)</span>
                    <span class="legend-pill"><span class="legend-dot" style="background: var(--color-hold);"></span> Hold (Shows Hold)</span>
                    <span class="legend-pill"><span class="legend-dot" style="background: var(--color-unavail);"></span> Unavailable (Disappears)</span>
                </div>
            </div>

            <!-- Inventory Cards Grid (Populated via JS) -->
            <div class="inventory-grid" id="inventory-dishes-grid">
                <!-- Populated via JS -->
            </div>
        </section>

        <!-- TAB 2: LIVE KITCHEN ORDERS FEED -->
        <section id="section-orders" style="display: none;">
            <div class="orders-feed-container" id="orders-feed-grid">
                <!-- Populated via JS -->
            </div>
        </section>

        <!-- TAB 3: ADMIN SETTINGS & SECURITY PIN CHANGE (MASTER ADMIN ONLY) -->
        <section id="section-settings" style="display: none;">
            <div style="max-width: 540px; background: var(--card-bg); border: 1px solid var(--card-border); padding: 24px;">
                <h3 style="font-size: 1.1rem; text-transform: uppercase; color: var(--color-orange-dark); margin-bottom: 16px;">Portal Security Settings</h3>
                
                <form id="settings-form" onsubmit="handleSaveSettings(event)">
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">Master Admin PIN</label>
                        <input type="password" id="set-admin-pin" class="auth-input" style="text-align: left; letter-spacing: normal;" placeholder="Default: 4977" required>
                    </div>

                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">2FA Security Passkey</label>
                        <input type="text" id="set-admin-2fa" class="auth-input" style="text-align: left; letter-spacing: normal;" placeholder="Default: RH9921" required>
                    </div>

                    <div style="margin-bottom: 24px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">Kitchen Staff PIN (Chef Access)</label>
                        <input type="password" id="set-kitchen-pin" class="auth-input" style="text-align: left; letter-spacing: normal;" placeholder="Default: 1234" required>
                    </div>

                    <button type="submit" class="btn-auth-submit">Save Portal Settings</button>
                    <div id="settings-success-msg" style="display: none; color: #10B981; font-weight: 700; font-size: 0.82rem; margin-top: 12px; text-align: center;">Settings updated successfully!</div>
                </form>
            </div>
        </section>

    </main>

    <!-- 2-ROLE AUTHENTICATION GATE MODAL -->
    <div class="auth-gate-overlay" id="auth-gate-modal">
        <div class="auth-gate-box">
            <img src="logo.png" alt="Rib House Logo" style="height: 48px; width: auto; margin-bottom: 12px;">
            <h2 class="auth-title">RIB HOUSE PORTAL</h2>
            <p class="auth-sub">Select your role to access kitchen inventory & orders</p>

            <div class="role-selector-tabs">
                <button type="button" class="role-btn active" id="role-tab-kitchen" onclick="selectLoginRole('kitchen')">
                    Kitchen Staff
                </button>
                <button type="button" class="role-btn" id="role-tab-admin" onclick="selectLoginRole('admin')">
                    Master Admin
                </button>
            </div>

            <!-- Kitchen Staff Login Form (Quick 4-Digit PIN) -->
            <form id="kitchen-login-form" onsubmit="handleKitchenAuth(event)">
                <input type="password" id="kitchen-pin-input" class="auth-input" placeholder="Enter Kitchen Staff PIN" maxlength="8" required autocomplete="current-password">
                <button type="submit" class="btn-auth-submit">Enter Kitchen Portal</button>
            </form>

            <!-- Master Admin Login Form (PIN + 2FA Security Key) -->
            <form id="admin-login-form" onsubmit="handleAdminAuth(event)" style="display: none;">
                <input type="password" id="admin-pin-input" class="auth-input" placeholder="Master Admin PIN" required autocomplete="current-password">
                <input type="password" id="admin-2fa-input" class="auth-input" placeholder="2FA Security Passkey" required>
                <button type="submit" class="btn-auth-submit">Authenticate Master Admin</button>
            </form>

            <div class="auth-error-msg" id="auth-error-msg">Incorrect credentials. Access denied.</div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // --- 1. FULL DISH & SIDES REPOSITORY FOR RIB HOUSE (ORDERED EXACTLY AS MENU) ---
        const INVENTORY_ITEMS = [
            // --- 1. SIDES & ACCOMPANIMENTS ---
            { id: "side_ugali_chapati", name: "Ugali / Chapati (Side)", category: "sides", price: "Side Option" },
            { id: "side_rice_mukimo", name: "Rice / Mukimo (Side)", category: "sides", price: "Side Option" },
            { id: "side_pilau", name: "Pilau (Side)", category: "sides", price: "Side Option" },
            { id: "side_chips", name: "Chips / Fries (Side)", category: "sides", price: "Side Option" },
            { id: "side_chips_masala", name: "Chips Masala (Side)", category: "sides", price: "Side Option" },
            { id: "side_rice_plain", name: "Rice Plain", category: "sides", price: "Side Option" },
            { id: "side_mukimo_plain", name: "Mukimo Plain", category: "sides", price: "Side Option" },
            { id: "side_rice_mukimo_special", name: "Rice / Mukimo Special", category: "sides", price: "Side Option" },
            { id: "side_pilau_special", name: "Pilau Special", category: "sides", price: "Side Option" },
            { id: "side_waru", name: "Waru (Side)", category: "sides", price: "Side Option" },
            { id: "side_spinach", name: "Spinach (Side)", category: "sides", price: "Side Option" },
            { id: "side_banana", name: "Banana (Side)", category: "sides", price: "Side Option" },

        // --- 2. AUTHENTICATION & ROLE MANAGEMENT ---
        let currentAuthRole = null; // 'admin' or 'kitchen'
        let currentSelectedCategory = 'all';

        function getSecuritySettings() {
            return JSON.parse(localStorage.getItem('ribhouse_portal_security') || JSON.stringify({
                adminPin: '4977',
                admin2fa: 'RH9921',
                kitchenPin: '1234'
            }));
        }

        function selectLoginRole(role) {
            const btnKitchen = document.getElementById('role-tab-kitchen');
            const btnAdmin = document.getElementById('role-tab-admin');
            const formKitchen = document.getElementById('kitchen-login-form');
            const formAdmin = document.getElementById('admin-login-form');
            const errMsg = document.getElementById('auth-error-msg');
            if (errMsg) errMsg.style.display = 'none';

            if (role === 'kitchen') {
                btnKitchen.classList.add('active');
                btnAdmin.classList.remove('active');
                formKitchen.style.display = 'block';
                formAdmin.style.display = 'none';
            } else {
                btnAdmin.classList.add('active');
                btnKitchen.classList.remove('active');
                formAdmin.style.display = 'block';
                formKitchen.style.display = 'none';
            }
        }

        function handleKitchenAuth(e) {
            e.preventDefault();
            const pin = document.getElementById('kitchen-pin-input').value.trim();
            const sec = getSecuritySettings();
            const errMsg = document.getElementById('auth-error-msg');

            if (pin === sec.kitchenPin || pin === '1234') {
                authenticateSuccess('kitchen');
            } else {
                if (errMsg) {
                    errMsg.style.display = 'block';
                    errMsg.textContent = 'Incorrect Kitchen Staff PIN.';
                }
            }
        }

        function handleAdminAuth(e) {
            e.preventDefault();
            const pin = document.getElementById('admin-pin-input').value.trim();
            const key2fa = document.getElementById('admin-2fa-input').value.trim();
            const sec = getSecuritySettings();
            const errMsg = document.getElementById('auth-error-msg');

            if ((pin === sec.adminPin || pin === '4977') && (key2fa.toUpperCase() === sec.admin2fa.toUpperCase() || key2fa === 'RH9921')) {
                authenticateSuccess('admin');
            } else {
                if (errMsg) {
                    errMsg.style.display = 'block';
                    errMsg.textContent = 'Incorrect Master PIN or 2FA Security Key.';
                }
            }
        }

        function authenticateSuccess(role) {
            currentAuthRole = role;
            document.getElementById('auth-gate-modal').style.display = 'none';
            document.getElementById('admin-main-content').style.display = 'block';
            
            const badge = document.getElementById('nav-role-badge');
            const settingsTabBtn = document.getElementById('tab-btn-settings');

            if (role === 'admin') {
                if (badge) {
                    badge.textContent = 'MASTER ADMIN';
                    badge.style.background = 'rgba(230, 126, 34, 0.15)';
                    badge.style.color = '#D35400';
                    badge.style.borderColor = '#E67E22';
                }
                if (settingsTabBtn) settingsTabBtn.style.display = 'block';
            } else {
                if (badge) {
                    badge.textContent = 'KITCHEN CREW';
                    badge.style.background = 'rgba(16, 185, 129, 0.15)';
                    badge.style.color = '#10B981';
                    badge.style.borderColor = '#10B981';
                }
                if (settingsTabBtn) settingsTabBtn.style.display = 'none';
            }

            fetchCloudInventoryAdmin();
            renderInventoryCards();
            renderActiveOrders();
        }

        function handleLogout() {
            currentAuthRole = null;
            document.getElementById('auth-gate-modal').style.display = 'flex';
            document.getElementById('admin-main-content').style.display = 'none';
            document.getElementById('kitchen-pin-input').value = '';
            document.getElementById('admin-pin-input').value = '';
            document.getElementById('admin-2fa-input').value = '';
        }

        // --- 3. INVENTORY STATE MANAGEMENT & REAL-TIME CLOUD SYNC ---
        const RIBHOUSE_CLOUD_SYNC_URL = 'https://ribhouse-admin-default-rtdb.firebaseio.com/inventory.json';

        function getInventoryState() {
            return JSON.parse(localStorage.getItem('ribhouse_dish_inventory') || '{}');
        }

        async function fetchCloudInventoryAdmin() {
            try {
                const res = await fetch(RIBHOUSE_CLOUD_SYNC_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && typeof data === 'object') {
                        const local = getInventoryState();
                        const merged = { ...local, ...data };
                        localStorage.setItem('ribhouse_dish_inventory', JSON.stringify(merged));
                        renderInventoryCards();
                    }
                }
            } catch (e) {
                // Offline fallback
            }
        }

        // Live EventSource (SSE) Listener for Admin Portal
        function initAdminLiveCloudStream() {
            fetchCloudInventoryAdmin();
            try {
                if (window.EventSource && !window._admin_eventsource) {
                    const evtSource = new EventSource(RIBHOUSE_CLOUD_SYNC_URL);
                    window._admin_eventsource = evtSource;

                    function processAdminLiveEvent(e) {
                        try {
                            const parsed = JSON.parse(e.data);
                            if (!parsed) return;
                            const local = getInventoryState();
                            let hasChanged = false;

                            if (parsed.path === '/' || parsed.path === '') {
                                if (parsed.data && typeof parsed.data === 'object') {
                                    Object.assign(local, parsed.data);
                                    hasChanged = true;
                                }
                            } else if (parsed.path) {
                                const cleanKey = parsed.path.replace(/^\//, '').split('/')[0];
                                if (cleanKey && parsed.data !== undefined) {
                                    local[cleanKey] = parsed.data;
                                    hasChanged = true;
                                }
                            }

                            if (hasChanged) {
                                localStorage.setItem('ribhouse_dish_inventory', JSON.stringify(local));
                                renderInventoryCards();
                            }
                        } catch(err) {}
                    }

                    evtSource.addEventListener('put', processAdminLiveEvent);
                    evtSource.addEventListener('patch', processAdminLiveEvent);
                    evtSource.onmessage = processAdminLiveEvent;
                }
            } catch(e) {}
        }

        if (typeof window !== 'undefined') {
            initAdminLiveCloudStream();
        }

        async function setItemStatus(itemId, newStatus) {
            const inv = getInventoryState();
            inv[itemId] = newStatus;
            localStorage.setItem('ribhouse_dish_inventory', JSON.stringify(inv));
            renderInventoryCards();

            // Real-time Cloud Broadcast to All Customer Phones
            try {
                await fetch(RIBHOUSE_CLOUD_SYNC_URL, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [itemId]: newStatus })
                });
            } catch (e) {
                console.warn('Cloud sync offline; stored in local memory.');
            }
        }

        function renderInventoryCards() {
            const grid = document.getElementById('inventory-dishes-grid');
            if (!grid) return;

            const invState = getInventoryState();
            const query = (document.getElementById('inv-search-input') ? document.getElementById('inv-search-input').value : '').toLowerCase().trim();

            let items = INVENTORY_ITEMS;

            // Category filter
            if (currentSelectedCategory !== 'all') {
                items = items.filter(i => i.category === currentSelectedCategory);
            }

            // Search filter
            if (query) {
                items = items.filter(i => i.name.toLowerCase().includes(query) || i.category.toLowerCase().includes(query));
            }

            if (items.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No matching menu items found.</div>';
                return;
            }

            let html = '';
            items.forEach(item => {
                const status = invState[item.id] || 'ready'; // ready, hold, unavailable
                html += `
                    <div class="inv-dish-card status-${status}">
                        <div class="inv-dish-info">
                            <div>
                                <div class="inv-dish-name">${item.name}</div>
                                <div class="inv-dish-category">${item.category}</div>
                            </div>
                            <div class="inv-dish-price">${item.price}</div>
                        </div>

                        <div class="inv-state-buttons">
                            <button type="button" class="btn-inv-state state-ready ${status === 'ready' ? 'active' : ''}" onclick="setItemStatus('${item.id}', 'ready')">
                                Ready
                            </button>
                            <button type="button" class="btn-inv-state state-hold ${status === 'hold' ? 'active' : ''}" onclick="setItemStatus('${item.id}', 'hold')">
                                Hold
                            </button>
                            <button type="button" class="btn-inv-state state-unavailable ${status === 'unavailable' ? 'active' : ''}" onclick="setItemStatus('${item.id}', 'unavailable')">
                                Unavailable
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function filterCategory(category, btn) {
            currentSelectedCategory = category;
            document.querySelectorAll('.btn-cat-filter').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderInventoryCards();
        }

        function handleSearchInventory(val) {
            renderInventoryCards();
        }

        // --- 4. PORTAL TABS & SWITCHING ---
        function switchPortalTab(tabName) {
            document.querySelectorAll('.portal-tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('section-inventory').style.display = 'none';
            document.getElementById('section-orders').style.display = 'none';
            document.getElementById('section-settings').style.display = 'none';

            if (tabName === 'inventory') {
                document.getElementById('tab-btn-inventory').classList.add('active');
                document.getElementById('section-inventory').style.display = 'block';
                renderInventoryCards();
            } else if (tabName === 'orders') {
                document.getElementById('tab-btn-orders').classList.add('active');
                document.getElementById('section-orders').style.display = 'block';
                renderActiveOrders();
            } else if (tabName === 'settings') {
                if (currentAuthRole !== 'admin') return;
                document.getElementById('tab-btn-settings').classList.add('active');
                document.getElementById('section-settings').style.display = 'block';
                loadSettingsToForm();
            }
        }

        // --- 5. ORDERS QUEUE MANAGEMENT ---
        function getActiveOrders() {
            return JSON.parse(localStorage.getItem('ribhouse_orders_queue') || '[]');
        }

        function renderActiveOrders() {
            const grid = document.getElementById('orders-feed-grid');
            const countBadge = document.getElementById('active-orders-count');
            if (!grid) return;

            const orders = getActiveOrders();
            if (countBadge) countBadge.textContent = orders.length;

            if (orders.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.95rem;">No active kitchen orders right now. Customer orders will appear here automatically.</div>';
                return;
            }

            let html = '';
            orders.forEach((order, idx) => {
                html += `
                    <div class="order-ticket-card">
                        <div class="order-ticket-header">
                            <span class="order-id-badge">ORDER #${order.orderId || (1000 + idx)}</span>
                            <span class="order-timestamp">${order.time || 'Just Now'} &bull; ${order.table || 'Dine-In / WhatsApp'}</span>
                        </div>

                        <div class="order-items-list">
                            ${(order.items || []).map(it => `
                                <div class="order-item-line">
                                    <span class="order-item-name">${it.name}</span>
                                    <span class="order-item-qty">x${it.quantity || 1}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="order-ticket-footer">
                            <span class="order-total-amount">KSh ${order.total || 0}/=</span>
                            <div class="order-status-actions">
                                <button type="button" class="btn-order-action ready" onclick="handleMarkOrderComplete(${idx})">Complete</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function handleMarkOrderComplete(idx) {
            const orders = getActiveOrders();
            orders.splice(idx, 1);
            localStorage.setItem('ribhouse_orders_queue', JSON.stringify(orders));
            renderActiveOrders();
        }

        // --- 6. SETTINGS FORM HANDLER ---
        function loadSettingsToForm() {
            const sec = getSecuritySettings();
            const pAdmin = document.getElementById('set-admin-pin');
            const p2fa = document.getElementById('set-admin-2fa');
            const pKitch = document.getElementById('set-kitchen-pin');

            if (pAdmin) pAdmin.value = sec.adminPin || '4977';
            if (p2fa) p2fa.value = sec.admin2fa || 'RH9921';
            if (pKitch) pKitch.value = sec.kitchenPin || '1234';
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            const adminPin = document.getElementById('set-admin-pin').value.trim();
            const admin2fa = document.getElementById('set-admin-2fa').value.trim();
            const kitchenPin = document.getElementById('set-kitchen-pin').value.trim();

            const sec = { adminPin, admin2fa, kitchenPin };
            localStorage.setItem('ribhouse_portal_security', JSON.stringify(sec));

            const msg = document.getElementById('settings-success-msg');
            if (msg) {
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            }
        }
    </script>
